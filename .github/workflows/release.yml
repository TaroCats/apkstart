name: Release fnOS Package

# ARCH §7.6：tag v* 或手动触发 → 打包 fpk + sha256 并上传 artifact
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v，如 0.2.0）'
        required: false
        default: '0.1.0'
      changelog:
        description: '版本说明（写进 fnpack.json 的 changelog，留空则用 tag 注释）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须把附注 tag 对象也拉下来：默认 fetch-depth=1 又不取 tag，注入的
          # refs/tags/vX 只是个指向 commit 的轻量引用，`git tag -l
          # --format='%(contents:subject)'` 会退化成读 **commit subject**，
          # changelog 直接变成 commit 首行（v0.2.0 实际踩到，写进了 fnpack.json）。
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            CHANGELOG="${{ github.event.inputs.changelog }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            # 取附注 tag 的标题作为版本说明：git tag -a v0.2.0 -m "..." 即可带上，
            # 避免每次发版都要在网页里手填一遍 changelog。
            CHANGELOG="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" || true)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 多行/含引号的说明走文件传递，避免 ::set-output 与 shell 转义的坑
          {
            echo 'changelog<<__CL_EOF__'
            printf '%s\n' "$CHANGELOG"
            echo '__CL_EOF__'
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"
          echo "Resolved changelog: ${CHANGELOG:-（空，使用默认说明）}"

      - name: Build fpk
        env:
          CHANGELOG: ${{ steps.ver.outputs.changelog }}
        run: bash build/pack.sh --version "${{ steps.ver.outputs.version }}"

      - name: Show sha256
        run: |
          echo "### ApkStart fpk sha256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/*.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/*.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apkstart-fnos-${{ steps.ver.outputs.version }}
          path: |
            dist/*.fpk
            dist/*.sha256
            dist/fnpack.snippet.json
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.ver.outputs.changelog }}
          files: |
            dist/*.fpk
            dist/*.sha256

      # FnDepot 添加外部源的方式是读「仓库根目录的 fnpack.json」（raw 地址），
      # 所以每次发版都要把本次构建出的 snippet 同步回仓库根，保证
      # 「仓库里的 fnpack.json」与「Release 里挂的 fpk」永远一致（ARCH §7.7）。
      # 用 cp 而不是重新跑 node 生成：确保与本次上传的 artifact 字节一致，
      # 不会出现两套生成逻辑漂移。
      - name: Sync fnpack.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # tag 触发时 checkout 是 detached HEAD，没有 upstream，直接 git push 会
          # 报 "You are not currently on a branch" 并失败；先落到默认分支再提交。
          # dist/ 在 .gitignore 里，切换分支不会丢掉刚构建出的产物。
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          cp dist/fnpack.snippet.json fnpack.json
          # 先 add 再比 --cached：git diff 对未跟踪文件返回 0（无差异），
          # 首次同步会误判「无变化」直接跳过，永远提交不上去。
          git add -- fnpack.json
          if git diff --cached --quiet -- fnpack.json; then
            echo "fnpack.json 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(fndepot): 同步 fnpack.json 到 v${{ steps.ver.outputs.version }}"
          git push origin "HEAD:$BRANCH"
