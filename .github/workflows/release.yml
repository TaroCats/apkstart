name: Release fnOS Package

# ARCH §7.6：tag v* 或手动触发 → 打包 fpk + sha256 并上传 artifact
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v，如 0.2.0）'
        required: false
        default: '0.1.0'
      changelog:
        description: '版本说明（写进 fnpack.json 的 changelog，留空则用 tag 注释）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 是为了让后续能取到历史 / 标签历史。
          # 注意：**它并不能**保证 `git tag --format='%(contents:subject)'` 拿到
          # 附注 tag 的标题 —— checkout 自己会用 `+<sha>:refs/tags/<tag>` 把 tag
          # 引用重置成轻量引用（见下方 Resolve version 里的详细说明与补救）。
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            CHANGELOG="${{ github.event.inputs.changelog }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            # 取附注 tag 的标题作为版本说明：git tag -a v0.2.0 -m "..." 即可带上。
            #
            # 坑（v0.2.0 / v0.2.1 连续踩两次）：actions/checkout 在 checkout tag 时
            # 会执行 `git fetch --no-tags ... origin +<sha>:refs/tags/<tag>`，把 ref
            # **强制重置成指向 commit 的轻量引用**，先前 `+refs/tags/*:refs/tags/*`
            # 拉下来的附注 tag 对象被覆盖。于是 `%(contents:subject)` 退化成读
            # commit subject。fetch-depth: 0 + fetch-tags: true 救不了 —— 覆盖发生在
            # checkout 自己那一步。必须在这里重新强拉一次（checkout 已结束，不会再被改）。
            git fetch --force --tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            OBJ_TYPE="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || echo unknown)"
            if [ "$OBJ_TYPE" != "tag" ]; then
              # 轻量 tag（没 -m）本来就没有附注，属预期；但要显式告警，别静默发一版
              # 说明是 commit 首行的包出去。
              echo "::warning::${GITHUB_REF_NAME} 不是附注 tag（object type=$OBJ_TYPE），changelog 将缺失；建议 git tag -a 带 -m"
            fi
            CHANGELOG="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" || true)"
            # 兜底断言：拿到 commit subject 说明 tag 引用仍是轻量的，明确告警。
            if [ -n "$CHANGELOG" ] && [ "$CHANGELOG" = "$(git log -1 --format=%s)" ]; then
              echo "::warning::changelog 等于 commit subject，tag 引用可能是轻量引用（changelog 会不好看）"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 多行/含引号的说明走文件传递，避免 ::set-output 与 shell 转义的坑
          {
            echo 'changelog<<__CL_EOF__'
            printf '%s\n' "$CHANGELOG"
            echo '__CL_EOF__'
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"
          echo "Resolved changelog: ${CHANGELOG:-（空，使用默认说明）}"

      - name: Build fpk
        env:
          CHANGELOG: ${{ steps.ver.outputs.changelog }}
        run: bash build/pack.sh --version "${{ steps.ver.outputs.version }}"

      - name: Show sha256
        run: |
          echo "### ApkStart fpk sha256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/*.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/*.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apkstart-fnos-${{ steps.ver.outputs.version }}
          path: |
            dist/*.fpk
            dist/*.sha256
            dist/fnpack.snippet.json
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.ver.outputs.changelog }}
          files: |
            dist/*.fpk
            dist/*.sha256

      # FnDepot 添加外部源的方式是读「仓库根目录的 fnpack.json」（raw 地址），
      # 所以每次发版都要把本次构建出的 snippet 同步回仓库根，保证
      # 「仓库里的 fnpack.json」与「Release 里挂的 fpk」永远一致（ARCH §7.7）。
      # 用 cp 而不是重新跑 node 生成：确保与本次上传的 artifact 字节一致，
      # 不会出现两套生成逻辑漂移。
      - name: Sync fnpack.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # tag 触发时 checkout 是 detached HEAD，没有 upstream，直接 git push 会
          # 报 "You are not currently on a branch" 并失败；先落到默认分支再提交。
          # dist/ 在 .gitignore 里，切换分支不会丢掉刚构建出的产物。
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          cp dist/fnpack.snippet.json fnpack.json
          # 先 add 再比 --cached：git diff 对未跟踪文件返回 0（无差异），
          # 首次同步会误判「无变化」直接跳过，永远提交不上去。
          git add -- fnpack.json
          if git diff --cached --quiet -- fnpack.json; then
            echo "fnpack.json 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(fndepot): 同步 fnpack.json 到 v${{ steps.ver.outputs.version }}"
          git push origin "HEAD:$BRANCH"
